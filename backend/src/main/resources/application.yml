server:
  port: 8080

spring:
  datasource:
    url: jdbc:sqlite:${app.base-dir}/data/tongguo.db
    driver-class-name: org.sqlite.JDBC
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      data-locations: classpath:data.sql

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto

logging:
  level:
    com.tongguo: debug

checkout:
  default-self-service-unit-price-fen: ${CHECKOUT_DEFAULT_SELF_SERVICE_UNIT_PRICE_FEN:0}
  default-tableware-unit-price-fen: ${CHECKOUT_DEFAULT_TABLEWARE_UNIT_PRICE_FEN:0}

wechat:
  miniapp:
    app-id: ${WECHAT_MINIAPP_APP_ID:}
    app-secret: ${WECHAT_MINIAPP_APP_SECRET:}
    token-secret: ${WECHAT_MINIAPP_TOKEN_SECRET:change-me-miniapp-token-secret}
    token-expire-days: ${WECHAT_MINIAPP_TOKEN_EXPIRE_DAYS:30}
